# Integrity review, unit tests plus an on-device smoke test on the newest emulator image, and a
# signed release build to Firebase App Distribution. Third-party actions are pinned to commit SHAs;
# tool downloads are checksum-verified, and setup-gradle validates the Gradle wrapper checksum.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  MOBSFSCAN_VERSION: 1.1.0
  FIREBASE_TOOLS_VERSION: 15.36.0
  # Newest Google APIs x86_64 emulator image published in the SDK repository.
  EMULATOR_API_LEVEL: "37.0"

jobs:
  integrity:
    name: Code integrity review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false

      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --verbose .

      - name: Privacy guard
        run: scripts/privacy-guard.sh

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Mobile security scan (mobsfscan, OWASP MASVS rules)
        run: |
          python -m pip install --quiet "mobsfscan==${MOBSFSCAN_VERSION}"
          mobsfscan --exit-warning .

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Lint (ktlint) and Android lint (security checks are errors)
        run: ./gradlew :app:ktlintCheck :app:lintDebug

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/ktlint/
          retention-days: 7

  test:
    name: Build and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

  emulator:
    name: On-device tests (latest emulator image)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
          retention-days: 7

  distribute:
    name: Release build to Firebase App Distribution
    needs: [integrity, test, emulator]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
      TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
    steps:
      - name: Check distribution is configured
        id: gate
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          [[ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]] || missing+=(FIREBASE_SERVICE_ACCOUNT_JSON)
          [[ -n "$FIREBASE_APP_ID" ]] || missing+=("FIREBASE_ANDROID_APP_ID (variable)")
          if (( ${#missing[@]} )); then
            echo "::notice title=Distribution skipped::Not configured; missing: ${missing[*]}"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.configured == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.gate.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.gate.outputs.configured == 'true'
        with:
          cache-read-only: true

      - name: Build signed release APK
        if: steps.gate.outputs.configured == 'true'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          ./gradlew :app:assembleRelease -PversionCode="$BUILD_NUMBER"
          rm "$ANDROID_KEYSTORE_PATH"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.gate.outputs.configured == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: "22"

      - name: Upload to Firebase App Distribution
        if: steps.gate.outputs.configured == 'true'
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          notes="$REF_NAME@${COMMIT_SHA:0:7}: $(git log -1 --format=%s)"
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes "$notes"
